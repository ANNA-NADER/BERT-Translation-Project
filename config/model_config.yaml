# Model Configuration
model:
  name: "bert-base-uncased"
  encoder:
    hidden_size: 768
    num_attention_heads: 12
    num_hidden_layers: 12
    intermediate_size: 3072
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
  
  decoder:
    hidden_size: 768
    num_attention_heads: 12
    num_decoder_layers: 6
    intermediate_size: 3072
    hidden_dropout_prob: 0.1
    attention_probs_dropout_prob: 0.1
  
  vocab:
    source_vocab_size: 30522  # BERT vocab size
    target_vocab_size: 32000  # French vocab size (will be built from data)
    max_position_embeddings: 512
    pad_token_id: 0
    bos_token_id: 101  # [CLS]
    eos_token_id: 102  # [SEP]
  
  generation:
    max_length: 128
    beam_size: 5
    length_penalty: 0.6
    no_repeat_ngram_size: 3
    early_stopping: true

# Language Configuration
languages:
  source: "en"
  target: "fr"
  source_name: "English"
  target_name: "French"
