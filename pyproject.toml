[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "checkpoints",
    "data",
    "logs",
    "runs",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
